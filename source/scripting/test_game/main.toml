[paths]
screenshot_dir = "captures"

[render]
window_title = "deren C# input demo"
window_width = 640
window_height = 360
# The runtime knobs below are parsed and applied by the managed framework (project_config) before
# the project's initialize; the native host only reads the creation parameters above.
taa = true
taa_blend_static = 0.9
taa_blend_min = 0.5
fxaa = true
# The laevatain look as it was first restored: the toon character stage ON (character_forward)
# drawing with the game-shader toon model (game_toon), the Khronos PBR Neutral tone curve at the
# exposure that look was tuned at. Both anti-aliasing lanes are on for this run (fxaa after the
# post chain, taa over the deferred path). Everything else stays at its default (procedural sky,
# the demo's own sun, bloom on, ssao on).
character_forward = true
game_toon = true
# A single cascade covers the character preview.
shadow_cascades = 1
shadow_map_size = 2048
exposure = 0.92
tone_mapping = 1

[lighting]
# The constant grey studio HDR the toon look was matched against (relative paths resolve against the
# executable directory, i.e. build/, hence the ../asset).
environment_hdr = "../asset/laevatain/laevatain_preview_constant.hdr"

[gui]
# the managed debug panel: the overlay loads only when show = true, and 0 sizes an axis to its content
show = true
panel_width = 460
panel_height = 0
