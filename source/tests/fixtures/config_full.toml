# config consumed by the app_config unit tests (tests/test_app_config.cpp).
# Keys deliberately cover every settings struct so a wrong parse/merge shows up.
# The layout is the shipped one: [render] + [debug] + [experimental]; [lighting] keeps only what identifies
# the environment and names a profile file that carries the numeric IBL knobs and the area light.
model = "Models/tri.gltf"

[paths]
shaders_dir = "shaders"
screenshot_dir = "captures"

[render]
offscreen = true
window_width = 800
window_height = 600
window_title = "vk_test"
vsync = true
clear_color = [0.1, 0.2, 0.3]
shadow = false
shadow_cascades = 2
shadow_map_size = 1024
shadow_cascade_blend = 0.25
clustered_lights = false
ssao = false
ssao_radius = 1.5
ssao_intensity = 0.5
ssao_samples = 4
rt_shadows = true
animation_time = 0.75
fxaa = true
bloom = false
render_scale = 0.5
upscale = "linear"
taa = true
taa_blend_static = 0.8
taa_blend_min = 0.2
game_toon = true
game_toon_copies = 3
# the frame's static surround as a second model (`[render] background_glb`): a NON-default value here, so
# the read-back is proven rather than inferred from an empty string that is also the compiled default
background_glb = "bg/test-background.glb"

# investigation switches (`[debug]`): a NON-default value for every one of them, so the read-back proves
# the parser looks in this table rather than in [render] where these keys used to live.
[debug]
async_present = true
furnace = true
unlit = true
gbuffer_debug = true
gbuffer_channel = 5
gpu_timings = false
validation_layers = false
rt_mask_bake = false
rt_skin_bake = true
demo_lights = 3

# research paths (`[experimental]`)
[experimental]
visibility_buffer = true
visibility_texture_streaming = true
subtilis = true
subtilis_error_px = 2.0
subtilis_hysteresis = true
software_raster = true
software_raster_threshold_px = 2.0

[lighting]
environment_hdr = "hdr/test-environment.hdr"
# The numeric IBL knobs and the reference package's area light live in `config_full_lighting.toml` beside this
# file; a relative profile path resolves against the config's own directory.
profile = "config_full_lighting.toml"

[gui]
show = false
panel_width = 320
panel_height = 200
